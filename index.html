<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars x Pokémon Unite 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a0f07;
        }
        #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .skill-btn { touch-action: manipulation; transition: transform 0.1s; }
        .skill-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- 遊戲 Start 大廳 (點擊開始以獲得鍵盤控制權) -->
    <div id="lobby-modal" class="absolute inset-0 bg-black/80 z-50 flex items-center justify-center interactive">
        <div class="bg-gray-900 border-2 border-amber-500 rounded-2xl p-6 text-white max-w-md w-full shadow-2xl text-center space-y-4">
            <h2 class="text-2xl font-bold text-amber-400">🌵 荒野亂鬥地圖 x 寶可夢大集結</h2>
            <p class="text-xs text-gray-300">完全還原自訂地圖！使用 <b class="text-amber-300">WASD</b> 控制移動，滑鼠控制瞄準方向。</p>
            <div class="text-xs bg-gray-800 p-3 rounded-lg text-left text-gray-300 space-y-1">
                <div>🎯 <b>核心玩法：</b></div>
                <div>1. 擊敗中央仙人掌（烈空坐）獲得大量能量球。</div>
                <div>2. 帶著能量走到中間<b>紅色金庫區域</b>點擊投籃。</div>
            </div>
            <button id="start-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-extrabold py-3.5 rounded-xl text-lg shadow-lg">
                🎮 開始遊戲 (點擊進入地圖)
            </button>
        </div>
    </div>

    <div id="game-container"></div>

    <!-- UI 介面 -->
    <div id="ui-layer" class="flex flex-col justify-between p-4">
        <div class="flex justify-between items-start">
            <div class="bg-gray-900/90 border border-yellow-500/50 rounded-xl p-3 flex items-center space-x-3 text-white shadow-lg interactive">
                <div class="relative">
                    <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow">⚡</div>
                    <span id="player-level" class="absolute -bottom-1 -right-1 bg-blue-600 text-xs px-1.5 py-0.5 rounded-full font-bold border border-white">Lv.1</span>
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-amber-400">皮卡丘 (能量: <span id="energy-count">0</span>/30)</span>
                    </div>
                    <div class="w-36 h-3 bg-gray-700 rounded-full overflow-hidden p-0.5 border border-gray-600">
                        <div id="hp-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-200" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900/90 border border-gray-700 rounded-xl px-6 py-2 text-white flex items-center space-x-6 text-center shadow-lg">
                <div>
                    <div class="text-[10px] text-blue-400 font-bold">我方總分</div>
                    <div id="team-score" class="text-2xl font-bold text-blue-300">0</div>
                </div>
                <div class="border-r border-gray-700 h-8"></div>
                <div>
                    <div class="text-[10px] text-amber-400 font-bold">剩餘時間</div>
                    <div id="game-time" class="text-xl font-bold text-amber-300">10:00</div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end pb-2">
            <div class="interactive flex flex-col items-start space-y-2">
                <button id="score-btn" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-extrabold px-6 py-3.5 rounded-2xl shadow-xl border-2 border-white text-base hidden animate-bounce">
                    🏀 按 E 或點此在金庫投籃得分！
                </button>
            </div>

            <div class="flex flex-col items-end space-y-2 interactive">
                <div class="flex items-center space-x-3 pr-2">
                    <button id="btn-z" class="skill-btn w-16 h-16 rounded-full bg-blue-600 border-2 border-blue-300 text-white font-bold flex flex-col items-center justify-center shadow-lg">
                        <span class="text-base">⚔️</span>
                        <span class="text-[10px]">Z / 普攻</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let player, aimArrow;
        let obstacles = []; // 碰撞體
        let wildMonsters = [], energyOrbs = [], projectiles = [];

        const playerStats = { hp: 1000, maxHp: 1000, speed: 0.22, energy: 0, maxEnergy: 30, radius: 0.8 };
        const keys = { w: false, a: false, s: false, d: false };
        const mousePos = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let mouseAimDir = new THREE.Vector3(0, 0, -1);
        let gameSecondsLeft = 600;

        // 直接綁定鍵盤事件 (使用 code 避免大小寫與輸入法問題)
        window.addEventListener('keydown', (e) => {
            const code = e.code;
            if (code === 'KeyW' || code === 'ArrowUp') keys.w = true;
            if (code === 'KeyS' || code === 'ArrowDown') keys.s = true;
            if (code === 'KeyA' || code === 'ArrowLeft') keys.a = true;
            if (code === 'KeyD' || code === 'ArrowRight') keys.d = true;
            if (code === 'KeyZ') castSkillZ();
            if (code === 'KeyE') tryScoreGoal();
        });

        window.addEventListener('keyup', (e) => {
            const code = e.code;
            if (code === 'KeyW' || code === 'ArrowUp') keys.w = false;
            if (code === 'KeyS' || code === 'ArrowDown') keys.s = false;
            if (code === 'KeyA' || code === 'ArrowLeft') keys.a = false;
            if (code === 'KeyD' || code === 'ArrowRight') keys.d = false;
        });

        window.addEventListener('mousemove', (e) => {
            mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
            mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('lobby-modal').style.display = 'none';
            window.focus();
        });

        function initGame() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a1810); // 沙漠暗褐環境色

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 38, 28);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 光照系統
            scene.add(new THREE.AmbientLight(0xfff0dd, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffe0b2, 0.9);
            dirLight.position.set(20, 45, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            buildBrawlStarsMap();
            createPlayer();
            createAimIndicator();
            spawnCactusBoss();

            document.getElementById('btn-z').addEventListener('click', castSkillZ);
            document.getElementById('score-btn').addEventListener('click', tryScoreGoal);

            animate();
        }

        // 精密建構《荒野亂鬥》地圖
        function buildBrawlStarsMap() {
            // 1. 棋盤格子沙漠地面 (格狀質感)
            const mapWidth = 50, mapHeight = 58;
            const groundGeo = new THREE.PlaneGeometry(mapWidth, mapHeight);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xd4a359, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 邊界高牆
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x6d4c41 });
            const addWall = (x, z, w, d) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 4, d), wallMat);
                wall.position.set(x, 2, z);
                scene.add(wall);
                obstacles.push({ x, z, radius: Math.max(w, d) / 2 });
            };
            addWall(0, -29, mapWidth, 2);
            addWall(0, 29, mapWidth, 2);
            addWall(-25, 0, 2, mapHeight);
            addWall(25, 0, 2, mapHeight);

            // 2. 荒野木箱 ( Wooden Crates - L 型牆與中路障礙物 )
            const boxGeo = new THREE.BoxGeometry(2.4, 2.4, 2.4);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xcd853f, roughness: 0.4 });
            
            const addBox = (x, z) => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(x, 1.2, z);
                box.castShadow = true;
                scene.add(box);
                obstacles.push({ x, z, radius: 1.3 }); // 精準箱子碰撞體
            };

            // 放置 L 型木箱牆 (還原圖紙左右側)
            const boxCoords = [
                // 左上 L 型牆
                [-18, -18], [-18, -15], [-18, -12], [-15, -12], [-12, -12],
                // 右上 L 型牆
                [18, -18], [18, -15], [18, -12], [15, -12], [12, -12],
                // 左下 L 型牆
                [-18, 18], [-18, 15], [-18, 12], [-15, 12], [-12, 12],
                // 右下 L 型牆
                [18, 18], [18, 15], [18, 12], [15, 12], [12, 12],
                // 中路障礙箱
                [-6, -6], [-6, -3], [-6, 0],
                [6, -6], [6, -3], [6, 0]
            ];
            boxCoords.forEach(pt => addBox(pt[0], pt[1]));

            // 3. 高黃草叢 (Bushes)
            const bushMat = new THREE.MeshStandardMaterial({ color: 0xfbc02d, transparent: true, opacity: 0.85 });
            const addBushZone = (x, z, w, d) => {
                const bush = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, d), bushMat);
                bush.position.set(x, 0.75, z);
                scene.add(bush);
            };
            addBushZone(-14, 0, 5, 14); // 左側高草叢
            addBushZone(14, 0, 5, 14);  // 右側高草叢

            // 4. 中央金庫得分區 (Red Hazard Zone + Safe)
            const hazardGeo = new THREE.PlaneGeometry(16, 8);
            const hazardMat = new THREE.MeshBasicMaterial({ color: 0xb71c1c, side: THREE.DoubleSide });
            const hazard = new THREE.Mesh(hazardGeo, hazardMat);
            hazard.rotation.x = -Math.PI / 2;
            hazard.position.set(0, 0.02, 0);
            scene.add(hazard);

            // 藍色金庫本體
            const vault = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 3), new THREE.MeshStandardMaterial({ color: 0x1976d2 }));
            vault.position.set(0, 1.5, 0);
            scene.add(vault);
            window.goalVault = vault;
            obstacles.push({ x: 0, z: 0, radius: 2.2 }); // 金庫本體不可穿透

            // 5. 彈簧跳板 (Yellow Launch Pads)
            const padMat = new THREE.MeshBasicMaterial({ color: 0xf57c00 });
            const addPad = (x, z) => {
                const pad = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), padMat);
                pad.rotation.x = -Math.PI / 2;
                pad.position.set(x, 0.05, z);
                scene.add(pad);
            };
            addPad(-7, -10); addPad(7, -10);
            addPad(-7, 10);  addPad(7, 10);

            // 6. 雙方出生點 (藍色圓圈)
            const spawnMat = new THREE.MeshBasicMaterial({ color: 0x0288d1, side: THREE.DoubleSide });
            const addSpawn = (z) => {
                const circle = new THREE.Mesh(new THREE.RingGeometry(2.5, 3, 32), spawnMat);
                circle.rotation.x = -Math.PI / 2;
                circle.position.set(0, 0.05, z);
                scene.add(circle);
            };
            addSpawn(-22); // 上方敵方出生點
            addSpawn(22);  // 下方我方出生點
        }

        function createPlayer() {
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffca28 }));
            body.position.y = 1;
            player.add(body);
            player.position.set(0, 0, 22); // 誕生在下方出生點
            scene.add(player);
        }

        function createAimIndicator() {
            aimArrow = new THREE.Group();
            const shape = new THREE.Shape();
            shape.moveTo(0, 0); shape.lineTo(0.3, 0); shape.lineTo(0.3, 3);
            shape.lineTo(0.7, 3); shape.lineTo(0, 4.5); shape.lineTo(-0.7, 3);
            shape.lineTo(-0.3, 3); shape.lineTo(-0.3, 0); shape.closePath();
            const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xffeb3b, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
            mesh.rotation.x = -Math.PI / 2;
            aimArrow.add(mesh);
            scene.add(aimArrow);
        }

        // 放置仙人掌 (烈空坐 BOSS)
        function spawnCactusBoss() {
            const cactusGroup = new THREE.Group();
            const cMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 3.2, 16), new THREE.MeshStandardMaterial({ color: 0x388e3c }));
            cMesh.position.y = 1.6;
            cactusGroup.add(cMesh);
            const flower = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xec407a }));
            flower.position.y = 3.3;
            cactusGroup.add(flower);

            cactusGroup.position.set(0, 0, -8);
            scene.add(cactusGroup);

            wildMonsters.push({ group: cactusGroup, hp: 1000, maxHp: 1000, alive: true, pos: cactusGroup.position });
        }

        function tryScoreGoal() {
            if (playerStats.energy <= 0) return;
            if (player.position.distanceTo(window.goalVault.position) < 5) {
                let pts = playerStats.energy;
                let currentScore = parseInt(document.getElementById('team-score').innerText);
                document.getElementById('team-score').innerText = currentScore + pts;
                playerStats.energy = 0;
                document.getElementById('energy-count').innerText = 0;
                document.getElementById('score-btn').style.display = 'none';
                alert(`🏀 投籃成功！在金庫得分獲得 ${pts} 分！`);
            }
        }

        function castSkillZ() {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffeb3b }));
            mesh.position.copy(player.position).add(new THREE.Vector3(0, 1, 0));
            scene.add(mesh);
            projectiles.push({ mesh, dir: mouseAimDir.clone(), speed: 0.75, damage: 120, range: 20, traveled: 0 });
        }

        function spawnEnergyOrb(pos, val) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
            mesh.position.copy(pos).y = 0.5;
            scene.add(mesh);
            energyOrbs.push({ mesh, value: val, pos: mesh.position });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (gameSecondsLeft > 0) {
                gameSecondsLeft -= delta;
                const m = Math.floor(gameSecondsLeft / 60);
                const s = Math.floor(gameSecondsLeft % 60);
                document.getElementById('game-time').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            // 獨立 X/Z 軸滑動移動邏輯 (核心：絕不卡死、撞牆滑行)
            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveDir.z -= 1;
            if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1;
            if (keys.d) moveDir.x += 1;

            let currentSpeed = playerStats.speed;
            // 進入中央紅色金庫區域時觸發緩速效果
            if (Math.abs(player.position.x) < 8 && Math.abs(player.position.z) < 4) {
                currentSpeed *= 0.55;
            }

            if (moveDir.length() > 0) {
                moveDir.normalize().multiplyScalar(currentSpeed);

                // 分開嘗試 X 軸與 Z 軸移動
                const nextX = player.position.x + moveDir.x;
                let cX = false;
                for (let obs of obstacles) {
                    if (Math.hypot(nextX - obs.x, player.position.z - obs.z) < obs.radius + playerStats.radius) {
                        cX = true; break;
                    }
                }
                if (!cX) player.position.x = nextX;

                const nextZ = player.position.z + moveDir.z;
                let cZ = false;
                for (let obs of obstacles) {
                    if (Math.hypot(player.position.x - obs.x, nextZ - obs.z) < obs.radius + playerStats.radius) {
                        cZ = true; break;
                    }
                }
                if (!cZ) player.position.z = nextZ;
            }

            // 滑鼠瞄準方向計算 (已修正箭頭朝向)
            raycaster.setFromCamera(mousePos, camera);
            const rayIntersectPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(groundPlane, rayIntersectPoint)) {
                mouseAimDir.copy(rayIntersectPoint).sub(player.position);
                mouseAimDir.y = 0;
                if (mouseAimDir.lengthSq() > 0.001) mouseAimDir.normalize();
            }

            aimArrow.position.copy(player.position);
            aimArrow.position.y = 0.05;
            aimArrow.rotation.y = Math.atan2(mouseAimDir.x, mouseAimDir.z);

            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 28;

            // 靠近金庫時彈出投籃按鈕
            if (player.position.distanceTo(window.goalVault.position) < 5.5 && playerStats.energy > 0) {
                document.getElementById('score-btn').style.display = 'block';
            } else {
                document.getElementById('score-btn').style.display = 'none';
            }

            // 撿取能量球
            for (let i = energyOrbs.length - 1; i >= 0; i--) {
                const orb = energyOrbs[i];
                if (player.position.distanceTo(orb.pos) < 2.0) {
                    playerStats.energy = Math.min(playerStats.maxEnergy, playerStats.energy + orb.value);
                    document.getElementById('energy-count').innerText = playerStats.energy;
                    scene.remove(orb.mesh);
                    energyOrbs.splice(i, 1);
                }
            }

            // 子彈移動與仙人掌擊中判定
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed));
                p.traveled += p.speed;

                let hit = false;
                wildMonsters.forEach(m => {
                    if (m.alive && p.mesh.position.distanceTo(m.pos) < 2.2) {
                        m.hp -= p.damage;
                        hit = true;
                        if (m.hp <= 0 && m.alive) {
                            m.alive = false;
                            m.group.visible = false;
                            spawnEnergyOrb(m.pos, 20); // 擊倒仙人掌掉落 20 點能量！
                        }
                    }
                });

                if (hit || p.traveled >= p.range) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
