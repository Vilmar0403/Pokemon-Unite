<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D MOBA P2P Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }
        #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .skill-btn { touch-action: manipulation; transition: transform 0.1s; }
        .skill-btn:active { transform: scale(0.9); }
        .joystick-container { touch-action: none; }
    </style>
</head>
<body>

    <!-- 簡易連線大廳遮罩 -->
    <div id="lobby-modal" class="absolute inset-0 bg-black/80 z-50 flex items-center justify-center interactive">
        <div class="bg-gray-900 border border-amber-500 rounded-2xl p-6 text-white max-w-md w-full shadow-2xl text-center space-y-4">
            <h2 class="text-2xl font-bold text-amber-400">⚔️ 3D MOBA 雙人連線對戰</h2>
            <p class="text-xs text-gray-300">你可以自訂房號（例如 room1），或直接點擊隨機生成，將房號告訴好友進行連線！</p>
            
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-left space-y-2">
                <div class="text-xs text-gray-400">你的房間 ID：</div>
                <div class="flex space-x-2">
                    <input type="text" id="my-room-input" class="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-amber-300 font-bold flex-1 text-sm outline-none" placeholder="輸入你的自訂房號">
                    <button id="set-room-btn" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded text-xs font-bold">使用此房號</button>
                </div>
            </div>

            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-left space-y-2">
                <div class="text-xs text-gray-400">加入好友房間：</div>
                <div class="flex space-x-2">
                    <input type="text" id="target-room-input" class="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-white flex-1 text-sm outline-none" placeholder="輸入好友的房號">
                    <button id="connect-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-bold">連線對戰</button>
                </div>
            </div>

            <div id="connection-status" class="text-xs text-gray-400">狀態：正在連線至伺服器...</div>
            
            <button id="start-solo-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl font-bold text-sm shadow">
                🎮 直接進入單人 / AI 練習賽
            </button>
        </div>
    </div>

    <div id="game-container"></div>

    <div id="ui-layer" class="flex flex-col justify-between p-4">
        <div class="flex justify-between items-start">
            <div class="bg-gray-900/80 backdrop-blur border border-yellow-500/50 rounded-xl p-3 flex items-center space-x-3 text-white shadow-lg interactive">
                <div class="relative">
                    <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow">⚡</div>
                    <span id="player-level" class="absolute -bottom-1 -right-1 bg-blue-600 text-xs px-1.5 py-0.5 rounded-full font-bold border border-white">Lv.1</span>
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-amber-400" id="player-name-tag">玩家 (主機)</span>
                        <span id="hp-text" class="text-gray-300">1000 / 1000</span>
                    </div>
                    <div class="w-36 h-3 bg-gray-700 rounded-full overflow-hidden p-0.5 border border-gray-600">
                        <div id="hp-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-200" style="width: 100%;"></div>
                    </div>
                    <div class="w-36 h-1.5 bg-gray-800 rounded-full overflow-hidden mt-1">
                        <div id="exp-bar" class="h-full bg-blue-400 rounded-full transition-all duration-200" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900/80 backdrop-blur border border-gray-700 rounded-xl px-6 py-2 text-white flex space-x-6 text-center shadow-lg">
                <div>
                    <div class="text-xs text-gray-400">擊倒數</div>
                    <div id="kill-count" class="text-xl font-bold text-amber-400">0</div>
                </div>
                <div class="border-r border-gray-700"></div>
                <div>
                    <div class="text-xs text-gray-400">連線狀態</div>
                    <div id="net-status" class="text-xs font-bold text-red-400 mt-1">未連線</div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end pb-2">
            <div id="joystick-zone" class="w-36 h-36 bg-gray-800/40 border-2 border-gray-500/30 rounded-full relative flex items-center justify-center joystick-container interactive md:opacity-50">
                <div id="joystick-thumb" class="w-14 h-14 bg-white/30 rounded-full border border-white/50 absolute shadow-lg"></div>
            </div>

            <div class="flex flex-col items-end space-y-2 interactive">
                <div class="flex items-end space-x-2">
                    <div class="relative">
                        <button id="btn-v" class="skill-btn w-14 h-14 rounded-full bg-purple-600 border-2 border-purple-300 text-white font-bold flex flex-col items-center justify-center shadow-lg">
                            <span class="text-sm">⚡</span>
                            <span class="text-[10px]">V / ZR招</span>
                        </button>
                    </div>
                    <div class="relative -top-4">
                        <button id="btn-x" class="skill-btn w-16 h-16 rounded-full bg-gradient-to-r from-amber-500 to-red-500 border-2 border-yellow-200 text-white font-bold flex flex-col items-center justify-center shadow-xl">
                            <span class="text-base">👑</span>
                            <span class="text-[9px]">X / 集結</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center space-x-3 pr-2">
                    <div class="relative">
                        <button id="btn-z" class="skill-btn w-14 h-14 rounded-full bg-blue-600 border-2 border-blue-300 text-white font-bold flex flex-col items-center justify-center shadow-lg">
                            <span class="text-sm">⚔️</span>
                            <span class="text-[10px]">Z / 普攻</span>
                        </button>
                    </div>
                    <div class="relative">
                        <button id="btn-c" class="skill-btn w-14 h-14 rounded-full bg-emerald-600 border-2 border-emerald-300 text-white font-bold flex flex-col items-center justify-center shadow-lg">
                            <span class="text-sm">💨</span>
                            <span class="text-[10px]">C / R招</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let player, remotePlayer, aimArrow;
        let projectiles = [];
        let peer, conn;
        let isConnected = false;

        const playerStats = { hp: 1000, maxHp: 1000, level: 1, exp: 0, maxExp: 100, speed: 0.18, kills: 0 };
        const keys = { w: false, a: false, s: false, d: false };
        const mousePos = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let mouseAimDir = new THREE.Vector3(0, 0, -1);

        // 初始化 PeerJS (自動隨機一個簡單 4 碼數字前綴或讓玩家自訂)
        const randomId = 'moba_' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('my-room-input').value = randomId;

        function initPeer(customId) {
            if (peer) peer.destroy();
            peer = new Peer(customId);

            peer.on('open', (id) => {
                document.getElementById('connection-status').innerText = `狀態：已連線至伺服器，你的房號為 [ ${id} ]`;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('connection-status').innerText = `狀態：對手已成功加入房間！`;
                setTimeout(() => document.getElementById('lobby-modal').style.display = 'none', 1000);
            });

            peer.on('error', (err) => {
                alert('連線錯誤或房號已被使用：' + err.type);
            });
        }

        document.getElementById('set-room-btn').addEventListener('click', () => {
            const id = document.getElementById('my-room-input').value.trim();
            if (id) initPeer(id);
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            const targetId = document.getElementById('target-room-input').value.trim();
            if (!targetId) return alert('請輸入好友的房號！');
            
            conn = peer.connect(targetId);
            setupConnection();
            setTimeout(() => {
                document.getElementById('lobby-modal').style.display = 'none';
            }, 1000);
        });

        document.getElementById('start-solo-btn').addEventListener('click', () => {
            document.getElementById('lobby-modal').style.display = 'none';
        });

        function setupConnection() {
            conn.on('open', () => {
                isConnected = true;
                document.getElementById('net-status').innerText = '已連線 (P2P)';
                document.getElementById('net-status').className = 'text-xs font-bold text-emerald-400 mt-1';
            });

            conn.on('data', (data) => {
                if (data.type === 'MOVE' && remotePlayer) {
                    remotePlayer.position.set(data.x, 0, data.z);
                    remotePlayer.rotation.y = data.rot;
                } else if (data.type === 'SKILL_Z') {
                    createProjectile(new THREE.Vector3(data.x, 1, data.z), new THREE.Vector3(data.dx, 0, data.dz), {
                        speed: 0.6, damage: 90, color: 0xffeb3b, size: 0.3, range: 15
                    });
                }
            });

            conn.on('close', () => {
                isConnected = false;
                document.getElementById('net-status').innerText = '對手已斷線';
                document.getElementById('net-status').className = 'text-xs font-bold text-red-400 mt-1';
            });
        }

        // 初始化遊戲場景
        function initGame() {
            initPeer(randomId);

            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a2b1a);

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 32, 22);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 地面
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x2e7d32 }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // 玩家角色 (黃色)
            player = new THREE.Group();
            const pBody = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffca28 }));
            pBody.position.y = 1;
            player.add(pBody);
            player.position.set(0, 0, 15);
            scene.add(player);

            // 對手角色 (藍色，用於 P2P 顯示)
            remotePlayer = new THREE.Group();
            const rBody = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshStandardMaterial({ color: 0x29b6f6 }));
            rBody.position.y = 1;
            remotePlayer.add(rBody);
            remotePlayer.position.set(5, 0, 15);
            scene.add(remotePlayer);

            // 正確方向的瞄準箭頭
            aimArrow = new THREE.Group();
            const shape = new THREE.Shape();
            shape.moveTo(0, 0); shape.lineTo(0.3, 0); shape.lineTo(0.3, 3);
            shape.lineTo(0.7, 3); shape.lineTo(0, 4.5); shape.lineTo(-0.7, 3);
            shape.lineTo(-0.3, 3); shape.lineTo(-0.3, 0); shape.closePath();
            const aimMesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xffeb3b, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
            aimMesh.rotation.x = -Math.PI / 2;
            aimArrow.add(aimMesh);
            scene.add(aimArrow);

            setupInputs();
            animate();
        }

        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = true; if (k === 'a') keys.a = true;
                if (k === 's') keys.s = true; if (k === 'd') keys.d = true;
                if (k === 'z') castSkillZ();
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = false; if (k === 'a') keys.a = false;
                if (k === 's') keys.s = false; if (k === 'd') keys.d = false;
            });
            window.addEventListener('mousemove', (e) => {
                mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
                mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            document.getElementById('btn-z').addEventListener('click', castSkillZ);
        }

        function castSkillZ() {
            createProjectile(player.position.clone().add(new THREE.Vector3(0, 1, 0)), mouseAimDir.clone(), {
                speed: 0.6, damage: 90, color: 0xffeb3b, size: 0.3, range: 15
            });

            if (isConnected && conn && conn.open) {
                conn.send({
                    type: 'SKILL_Z',
                    x: player.position.x,
                    z: player.position.z,
                    dx: mouseAimDir.x,
                    dz: mouseAimDir.z
                });
            }
        }

        function createProjectile(pos, dir, config) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(config.size, 16, 16), new THREE.MeshBasicMaterial({ color: config.color }));
            mesh.position.copy(pos);
            scene.add(mesh);
            projectiles.push({ mesh, dir, speed: config.speed, range: config.range, traveled: 0 });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveDir.z -= 1; if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1; if (keys.d) moveDir.x += 1;
            if (moveDir.length() > 0) {
                player.position.add(moveDir.normalize().multiplyScalar(playerStats.speed));
            }

            raycaster.setFromCamera(mousePos, camera);
            const rayIntersectPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(groundPlane, rayIntersectPoint)) {
                mouseAimDir.subVectors(rayIntersectPoint, player.position);
                mouseAimDir.y = 0;
                if (mouseAimDir.lengthSq() > 0.001) mouseAimDir.normalize();
                player.rotation.y = Math.atan2(mouseAimDir.x, mouseAimDir.z);
            }

            aimArrow.position.copy(player.position);
            aimArrow.position.y = 0.05;
            aimArrow.rotation.y = Math.atan2(mouseAimDir.x, mouseAimDir.z);

            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 22;

            // P2P 座標同步發送
            if (isConnected && conn && conn.open) {
                conn.send({
                    type: 'MOVE',
                    x: player.position.x,
                    z: player.position.z,
                    rot: player.rotation.y
                });
            }

            // 更新子彈
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed));
                p.traveled += p.speed;
                if (p.traveled >= p.range) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
