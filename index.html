<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D MOBA Arena Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }
        #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .skill-btn { touch-action: manipulation; transition: transform 0.1s; }
        .skill-btn:active { transform: scale(0.9); }
        .joystick-container { touch-action: none; }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer" class="flex flex-col justify-between p-4">
        <!-- 頂部 UI -->
        <div class="flex justify-between items-start">
            <div class="bg-gray-900/80 backdrop-blur border border-yellow-500/50 rounded-xl p-3 flex items-center space-x-3 text-white shadow-lg interactive">
                <div class="relative">
                    <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow">⚡</div>
                    <span id="player-level" class="absolute -bottom-1 -right-1 bg-blue-600 text-xs px-1.5 py-0.5 rounded-full font-bold border border-white">Lv.1</span>
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-amber-400">寶可夢原型</span>
                        <span id="hp-text" class="text-gray-300">1000 / 1000</span>
                    </div>
                    <div class="w-36 h-3 bg-gray-700 rounded-full overflow-hidden p-0.5 border border-gray-600">
                        <div id="hp-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-200" style="width: 100%;"></div>
                    </div>
                    <div class="w-36 h-1.5 bg-gray-800 rounded-full overflow-hidden mt-1">
                        <div id="exp-bar" class="h-full bg-blue-400 rounded-full transition-all duration-200" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900/80 backdrop-blur border border-gray-700 rounded-xl px-6 py-2 text-white flex space-x-6 text-center shadow-lg">
                <div>
                    <div class="text-xs text-gray-400">擊倒數</div>
                    <div id="kill-count" class="text-xl font-bold text-amber-400">0</div>
                </div>
                <div class="border-r border-gray-700"></div>
                <div>
                    <div class="text-xs text-gray-400">時間</div>
                    <div id="game-time" class="text-xl font-bold">00:00</div>
                </div>
            </div>

            <div class="hidden md:block bg-gray-900/80 backdrop-blur border border-gray-700 rounded-xl p-3 text-white text-xs space-y-1 shadow-lg interactive">
                <div class="font-bold text-amber-400 mb-1">PC 操作說明</div>
                <div><kbd class="bg-gray-700 px-1 rounded text-amber-300">WASD</kbd> : 移動方向</div>
                <div><kbd class="bg-gray-700 px-1 rounded text-amber-300">滑鼠標</kbd> : 瞄準方向</div>
                <div><kbd class="bg-gray-700 px-1 rounded text-amber-300">Z</kbd> : 普攻 (Basic)</div>
                <div><kbd class="bg-gray-700 px-1 rounded text-amber-300">C</kbd> : R招式 (Dash/衝鋒)</div>
                <div><kbd class="bg-gray-700 px-1 rounded text-amber-300">V</kbd> : ZR招式 (Skillshot/電光)</div>
                <div><kbd class="bg-gray-700 px-1 rounded text-amber-300">X</kbd> : 集結招式 (Unite Move)</div>
            </div>
        </div>

        <!-- 底部 UI -->
        <div class="flex justify-between items-end pb-2">
            <div id="joystick-zone" class="w-36 h-36 bg-gray-800/40 border-2 border-gray-500/30 rounded-full relative flex items-center justify-center joystick-container interactive md:opacity-50">
                <div id="joystick-thumb" class="w-14 h-14 bg-white/30 rounded-full border border-white/50 absolute shadow-lg"></div>
            </div>

            <div class="flex flex-col items-end space-y-2 interactive">
                <div class="flex items-end space-x-2">
                    <div class="relative">
                        <button id="btn-v" class="skill-btn w-14 h-14 rounded-full bg-purple-600 border-2 border-purple-300 text-white font-bold flex flex-col items-center justify-center shadow-lg">
                            <span class="text-sm">⚡</span>
                            <span class="text-[10px]">V / ZR招</span>
                        </button>
                        <div id="cd-v" class="absolute inset-0 bg-black/70 rounded-full flex items-center justify-center text-white font-bold text-sm hidden">4.0</div>
                    </div>
                    <div class="relative -top-4">
                        <button id="btn-x" class="skill-btn w-16 h-16 rounded-full bg-gradient-to-r from-amber-500 to-red-500 border-2 border-yellow-200 text-white font-bold flex flex-col items-center justify-center shadow-xl">
                            <span class="text-base">👑</span>
                            <span class="text-[9px]">X / 集結招式</span>
                        </button>
                        <div id="cd-x" class="absolute inset-0 bg-black/70 rounded-full flex items-center justify-center text-white font-bold text-sm hidden">12.0</div>
                    </div>
                </div>
                <div class="flex items-center space-x-3 pr-2">
                    <div class="relative">
                        <button id="btn-z" class="skill-btn w-14 h-14 rounded-full bg-blue-600 border-2 border-blue-300 text-white font-bold flex flex-col items-center justify-center shadow-lg">
                            <span class="text-sm">⚔️</span>
                            <span class="text-[10px]">Z / 普攻</span>
                        </button>
                        <div id="cd-z" class="absolute inset-0 bg-black/70 rounded-full flex items-center justify-center text-white font-bold text-xs hidden">0.4</div>
                    </div>
                    <div class="relative">
                        <button id="btn-c" class="skill-btn w-14 h-14 rounded-full bg-emerald-600 border-2 border-emerald-300 text-white font-bold flex flex-col items-center justify-center shadow-lg">
                            <span class="text-sm">💨</span>
                            <span class="text-[10px]">C / R招</span>
                        </button>
                        <div id="cd-c" class="absolute inset-0 bg-black/70 rounded-full flex items-center justify-center text-white font-bold text-sm hidden">2.5</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let player, aimArrow;
        let bots = [];
        let projectiles = [];
        let particles = [];
        
        const playerStats = { hp: 1000, maxHp: 1000, level: 1, exp: 0, maxExp: 100, speed: 0.18, kills: 0 };
        const keys = { w: false, a: false, s: false, d: false };
        const mousePos = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let mouseAimDir = new THREE.Vector3(0, 0, -1);

        const cooldowns = {
            z: { current: 0, max: 0.4, el: null, cdEl: null },
            c: { current: 0, max: 2.5, el: null, cdEl: null },
            v: { current: 0, max: 4.0, el: null, cdEl: null },
            x: { current: 0, max: 12.0, el: null, cdEl: null }
        };

        let gameStartTime = Date.now();

        function init() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a2b1a);

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 32, 22);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createArena();
            createPlayer();
            createAimIndicator();
            spawnBots();

            cooldowns.z.el = document.getElementById('btn-z'); cooldowns.z.cdEl = document.getElementById('cd-z');
            cooldowns.c.el = document.getElementById('btn-c'); cooldowns.c.cdEl = document.getElementById('cd-c');
            cooldowns.v.el = document.getElementById('btn-v'); cooldowns.v.cdEl = document.getElementById('cd-v');
            cooldowns.x.el = document.getElementById('btn-x'); cooldowns.x.cdEl = document.getElementById('cd-x');

            setupInputs();
            animate();
        }

        function createArena() {
            const groundGeo = new THREE.PlaneGeometry(80, 80);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createPlayer() {
            player = new THREE.Group();
            const bodyGeo = new THREE.SphereGeometry(1, 32, 32);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffca28 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            player.add(body);

            player.position.set(0, 0, 15);
            scene.add(player);
        }

        // 修正後的箭頭指向（從角色朝向滑鼠位置）
        function createAimIndicator() {
            aimArrow = new THREE.Group();
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);           // 底部起點
            shape.lineTo(0.3, 0);
            shape.lineTo(0.3, 3);         // 箭身長度
            shape.lineTo(0.7, 3);
            shape.lineTo(0, 4.5);         // 箭頭尖端朝前方
            shape.lineTo(-0.7, 3);
            shape.lineTo(-0.3, 3);
            shape.lineTo(-0.3, 0);
            shape.closePath();

            const geom = new THREE.ShapeGeometry(shape);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffeb3b, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.rotation.x = -Math.PI / 2;
            aimArrow.add(mesh);
            scene.add(aimArrow);
        }

        // 產生 AI 對戰電腦人
        function spawnBots() {
            const botPositions = [
                { x: -10, z: -5 },
                { x: 10, z: -5 },
                { x: 0, z: -15 }
            ];

            botPositions.forEach((pos, idx) => {
                const botGroup = new THREE.Group();
                const bodyGeo = new THREE.SphereGeometry(1, 16, 16);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe53935 }); // 紅色敵方
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1;
                botGroup.add(body);

                botGroup.position.set(pos.x, 0, pos.z);
                scene.add(botGroup);

                bots.push({
                    mesh: botGroup,
                    hp: 500,
                    maxHp: 500,
                    alive: true,
                    respawnTimer: 0,
                    lastAttack: 0
                });
            });
        }

        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = true; if (k === 'a') keys.a = true;
                if (k === 's') keys.s = true; if (k === 'd') keys.d = true;
                if (k === 'z') castSkillZ(); if (k === 'c') castSkillC();
                if (k === 'v') castSkillV(); if (k === 'x') castSkillX();
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = false; if (k === 'a') keys.a = false;
                if (k === 's') keys.s = false; if (k === 'd') keys.d = false;
            });

            window.addEventListener('mousemove', (e) => {
                mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
                mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            document.getElementById('btn-z').addEventListener('click', castSkillZ);
            document.getElementById('btn-c').addEventListener('click', castSkillC);
            document.getElementById('btn-v').addEventListener('click', castSkillV);
            document.getElementById('btn-x').addEventListener('click', castSkillX);
        }

        function castSkillZ() {
            if (cooldowns.z.current > 0) return;
            startCooldown('z');
            createProjectile(player.position.clone().add(new THREE.Vector3(0, 1, 0)), mouseAimDir.clone(), { speed: 0.6, damage: 90, color: 0xffeb3b, size: 0.3, range: 15, isPlayer: true });
        }

        function castSkillC() {
            if (cooldowns.c.current > 0) return;
            startCooldown('c');
            player.position.add(mouseAimDir.clone().multiplyScalar(6));
            bots.forEach(b => {
                if (b.alive && b.mesh.position.distanceTo(player.position) < 3.5) applyDamage(b, 180);
            });
        }

        function castSkillV() {
            if (cooldowns.v.current > 0) return;
            startCooldown('v');
            createProjectile(player.position.clone().add(new THREE.Vector3(0, 1, 0)), mouseAimDir.clone(), { speed: 0.8, damage: 280, color: 0xab47bc, size: 0.7, range: 22, isPlayer: true });
        }

        function castSkillX() {
            if (cooldowns.x.current > 0) return;
            startCooldown('x');
            bots.forEach(b => {
                if (b.alive && b.mesh.position.distanceTo(player.position) < 9) applyDamage(b, 500);
            });
        }

        function startCooldown(k) {
            cooldowns[k].current = cooldowns[k].max;
            cooldowns[k].cdEl.classList.remove('hidden');
        }

        function createProjectile(pos, dir, config) {
            const geo = new THREE.SphereGeometry(config.size, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: config.color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            scene.add(mesh);

            projectiles.push({ mesh, dir, speed: config.speed, damage: config.damage, range: config.range, traveled: 0, isPlayer: config.isPlayer });
        }

        function applyDamage(target, amount) {
            target.hp -= amount;
            if (target.hp <= 0 && target.alive) {
                target.alive = false;
                target.mesh.visible = false;
                target.respawnTimer = 4.0;
                playerStats.kills += 1;
                addExp(60);
                document.getElementById('kill-count').innerText = playerStats.kills;
            }
        }

        function addExp(amount) {
            playerStats.exp += amount;
            if (playerStats.exp >= playerStats.maxExp) {
                playerStats.level += 1;
                playerStats.exp -= playerStats.maxExp;
                playerStats.maxExp = Math.floor(playerStats.maxExp * 1.3);
                playerStats.maxHp += 150;
                playerStats.hp = playerStats.maxHp;
                document.getElementById('player-level').innerText = `Lv.${playerStats.level}`;
            }
            document.getElementById('hp-text').innerText = `${Math.ceil(playerStats.hp)} / ${playerStats.maxHp}`;
            document.getElementById('hp-bar').style.width = `${(playerStats.hp / playerStats.maxHp) * 100}%`;
            document.getElementById('exp-bar').style.width = `${(playerStats.exp / playerStats.maxExp) * 100}%`;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // 1. 移動邏輯
            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveDir.z -= 1; if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1; if (keys.d) moveDir.x += 1;
            if (moveDir.length() > 0) player.position.add(moveDir.normalize().multiplyScalar(playerStats.speed));

            // 2. 瞄準方向計算
            raycaster.setFromCamera(mousePos, camera);
            const rayIntersectPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(groundPlane, rayIntersectPoint)) {
                mouseAimDir.subVectors(rayIntersectPoint, player.position);
                mouseAimDir.y = 0;
                if (mouseAimDir.lengthSq() > 0.001) mouseAimDir.normalize();
            }

            // 修正：箭頭朝向 mouseAimDir 正前方
            aimArrow.position.copy(player.position);
            aimArrow.position.y = 0.05;
            aimArrow.rotation.y = Math.atan2(mouseAimDir.x, mouseAimDir.z);

            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 22;

            // 3. AI 電腦人追擊邏輯
            bots.forEach(bot => {
                if (bot.alive) {
                    const distToPlayer = bot.mesh.position.distanceTo(player.position);
                    if (distToPlayer > 3 && distToPlayer < 18) {
                        const dir = player.position.clone().sub(bot.mesh.position).normalize();
                        bot.mesh.position.add(dir.multiplyScalar(0.08));
                    }
                    // AI 自動攻擊
                    if (distToPlayer <= 4 && Date.now() - bot.lastAttack > 1500) {
                        bot.lastAttack = Date.now();
                        playerStats.hp = Math.max(0, playerStats.hp - 50);
                        document.getElementById('hp-text').innerText = `${Math.ceil(playerStats.hp)} / ${playerStats.maxHp}`;
                        document.getElementById('hp-bar').style.width = `${(playerStats.hp / playerStats.maxHp) * 100}%`;
                    }
                } else {
                    bot.respawnTimer -= delta;
                    if (bot.respawnTimer <= 0) {
                        bot.alive = true; bot.hp = bot.maxHp; bot.mesh.visible = true;
                    }
                }
            });

            // 4. 子彈與 CD
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed));
                p.traveled += p.speed;

                let hit = false;
                if (p.isPlayer) {
                    bots.forEach(b => {
                        if (b.alive && p.mesh.position.distanceTo(b.mesh.position) < 1.2) {
                            applyDamage(b, p.damage); hit = true;
                        }
                    });
                }
                if (hit || p.traveled >= p.range) {
                    scene.remove(p.mesh); projectiles.splice(i, 1);
                }
            }

            Object.keys(cooldowns).forEach(k => {
                const cd = cooldowns[k];
                if (cd.current > 0) {
                    cd.current -= delta;
                    cd.cdEl.innerText = cd.current.toFixed(1);
                    if (cd.current <= 0) { cd.current = 0; cd.cdEl.classList.add('hidden'); }
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
