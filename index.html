<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Unite Web MOBA Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }
        #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .skill-btn { touch-action: manipulation; transition: transform 0.1s; }
        .skill-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- 大廳與連線設定 -->
    <div id="lobby-modal" class="absolute inset-0 bg-black/85 z-50 flex items-center justify-center interactive">
        <div class="bg-gray-900 border border-amber-500 rounded-2xl p-6 text-white max-w-md w-full shadow-2xl text-center space-y-4">
            <h2 class="text-2xl font-bold text-amber-400">⚡ 寶可夢大集結 Web 版</h2>
            <p class="text-xs text-gray-300">收集億奧斯能量、去得分點投籃！最後 2 分鐘分數加倍，擊敗烈空坐贏得勝利！</p>
            
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-left space-y-2">
                <div class="text-xs text-gray-400">建立房間 ID：</div>
                <div class="flex space-x-2">
                    <input type="text" id="my-room-input" class="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-amber-300 font-bold flex-1 text-sm outline-none">
                    <button id="set-room-btn" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded text-xs font-bold">啟用房號</button>
                </div>
            </div>

            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-left space-y-2">
                <div class="text-xs text-gray-400">加入好友房間：</div>
                <div class="flex space-x-2">
                    <input type="text" id="target-room-input" class="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-white flex-1 text-sm outline-none" placeholder="輸入好友房號">
                    <button id="connect-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-bold">加入對戰</button>
                </div>
            </div>

            <div id="connection-status" class="text-xs text-gray-400">伺服器連線中...</div>
            <button id="start-solo-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-bold text-sm shadow">
                🎮 開始單人 / AI 練習賽
            </button>
        </div>
    </div>

    <div id="game-container"></div>

    <!-- 遊戲 UI 介面 -->
    <div id="ui-layer" class="flex flex-col justify-between p-4">
        <!-- 頂部計分板與狀態 -->
        <div class="flex justify-between items-start">
            <div class="bg-gray-900/80 backdrop-blur border border-yellow-500/50 rounded-xl p-3 flex items-center space-x-3 text-white shadow-lg interactive">
                <div class="relative">
                    <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow">⚡</div>
                    <span id="player-level" class="absolute -bottom-1 -right-1 bg-blue-600 text-xs px-1.5 py-0.5 rounded-full font-bold border border-white">Lv.1</span>
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-amber-400">皮卡丘 (能量: <span id="energy-count">0</span>/30)</span>
                        <span id="hp-text" class="text-gray-300">1000 / 1000</span>
                    </div>
                    <div class="w-36 h-3 bg-gray-700 rounded-full overflow-hidden p-0.5 border border-gray-600">
                        <div id="hp-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-200" style="width: 100%;"></div>
                    </div>
                    <div class="w-36 h-1.5 bg-gray-800 rounded-full overflow-hidden mt-1">
                        <div id="exp-bar" class="h-full bg-blue-400 rounded-full transition-all duration-200" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- 比分與時間 -->
            <div class="bg-gray-900/80 backdrop-blur border border-gray-700 rounded-xl px-6 py-2 text-white flex items-center space-x-6 text-center shadow-lg">
                <div>
                    <div class="text-[10px] text-blue-400 font-bold">我方總分</div>
                    <div id="team-score" class="text-2xl font-bold text-blue-300">0</div>
                </div>
                <div class="border-r border-gray-700 h-8"></div>
                <div>
                    <div class="text-[10px] text-amber-400 font-bold" id="time-title">剩餘時間</div>
                    <div id="game-time" class="text-xl font-bold text-amber-300">10:00</div>
                </div>
                <div class="border-r border-gray-700 h-8"></div>
                <div>
                    <div class="text-[10px] text-red-400 font-bold">敵方總分</div>
                    <div id="enemy-score" class="text-2xl font-bold text-red-300">0</div>
                </div>
            </div>
        </div>

        <!-- 底部技能按鈕與投籃提示 -->
        <div class="flex justify-between items-end pb-2">
            <div class="interactive flex flex-col items-start space-y-2">
                <button id="score-btn" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-extrabold px-5 py-3 rounded-2xl shadow-xl border-2 border-white text-sm hidden animate-bounce">
                    🏀 按 E 或點此投籃得分！
                </button>
            </div>

            <div class="flex flex-col items-end space-y-2 interactive">
                <div class="flex items-end space-x-2">
                    <button id="btn-v" class="skill-btn w-14 h-14 rounded-full bg-purple-600 border-2 border-purple-300 text-white font-bold flex flex-col items-center justify-center shadow-lg"><span class="text-sm">⚡</span><span class="text-[10px]">V/ZR</span></button>
                    <button id="btn-x" class="skill-btn w-16 h-16 rounded-full bg-gradient-to-r from-amber-500 to-red-500 border-2 border-yellow-200 text-white font-bold flex flex-col items-center justify-center shadow-xl -top-4 relative"><span class="text-base">👑</span><span class="text-[9px]">X/集結</span></button>
                </div>
                <div class="flex items-center space-x-3 pr-2">
                    <button id="btn-z" class="skill-btn w-14 h-14 rounded-full bg-blue-600 border-2 border-blue-300 text-white font-bold flex flex-col items-center justify-center shadow-lg"><span class="text-sm">⚔️</span><span class="text-[10px]">Z/普攻</span></button>
                    <button id="btn-c" class="skill-btn w-14 h-14 rounded-full bg-emerald-600 border-2 border-emerald-300 text-white font-bold flex flex-col items-center justify-center shadow-lg"><span class="text-sm">💨</span><span class="text-[10px]">C/R招</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let player, aimArrow;
        let obstacles = []; // 碰撞障礙物清單
        let bots = [], wildMonsters = [], energyOrbs = [], projectiles = [];
        let peer, conn, isConnected = false;

        const playerStats = { hp: 1000, maxHp: 1000, level: 1, exp: 0, maxExp: 100, speed: 0.18, energy: 0, maxEnergy: 30 };
        const gameScores = { team: 0, enemy: 0 };
        const keys = { w: false, a: false, s: false, d: false };
        const mousePos = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let mouseAimDir = new THREE.Vector3(0, 0, -1);

        let gameSecondsLeft = 600; // 10分鐘 (600秒)
        let isFinalStretch = false;

        // 初始化 PeerJS
        const randomId = 'unite_' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('my-room-input').value = randomId;

        function initPeer(id) {
            if (peer) peer.destroy();
            peer = new Peer(id);
            peer.on('open', (myId) => document.getElementById('connection-status').innerText = `已連線，房號: ${myId}`);
            peer.on('connection', (c) => { conn = c; setupConn(); document.getElementById('lobby-modal').style.display = 'none'; });
        }

        document.getElementById('set-room-btn').addEventListener('click', () => initPeer(document.getElementById('my-room-input').value));
        document.getElementById('connect-btn').addEventListener('click', () => {
            conn = peer.connect(document.getElementById('target-room-input').value);
            setupConn();
            document.getElementById('lobby-modal').style.display = 'none';
        });
        document.getElementById('start-solo-btn').addEventListener('click', () => document.getElementById('lobby-modal').style.display = 'none');

        function setupConn() {
            conn.on('open', () => isConnected = true);
            conn.on('data', (d) => {
                if (d.type === 'MOVE' && window.remotePlayer) {
                    remotePlayer.position.set(d.x, 0, d.z);
                    remotePlayer.rotation.y = d.rot;
                }
            });
        }

        // 初始化 3D 遊戲世界與碰撞地圖
        function initGame() {
            initPeer(randomId);
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111c11);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 34, 24);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createMapAndCollisions();
            createPlayer();
            createAimIndicator();
            spawnWildMonsters();

            setupInputs();
            animate();
        }

        // 建立地圖、得分點與防穿模碰撞障礙物
        function createMapAndCollisions() {
            // 地面
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 邊界牆壁 (防止穿模出界)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20 });
            const addWall = (x, z, w, d) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 4, d), wallMat);
                wall.position.set(x, 2, z);
                scene.add(wall);
                obstacles.push({ x, z, radius: Math.max(w, d) / 2 });
            };
            addWall(0, -40, 80, 2); // 北牆
            addWall(0, 40, 80, 2);  // 南牆
            addWall(-40, 0, 2, 80); // 西牆
            addWall(40, 0, 2, 80);  // 東牆

            // 場地障礙物 (柱子/牆角，角色不能穿過去)
            const addObstacle = (x, z, r) => {
                const obs = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 3, 16), new THREE.MeshStandardMaterial({ color: 0x388e3c }));
                obs.position.set(x, 1.5, z);
                scene.add(obs);
                obstacles.push({ x, z, radius: r });
            };
            addObstacle(-15, -10, 3);
            addObstacle(15, -10, 3);
            addObstacle(-15, 10, 3);
            addObstacle(15, 10, 3);

            // 敵方得分點 (上方圓圈)
            const goalGeo = new THREE.RingGeometry(3.5, 4, 32);
            const goalMat = new THREE.MeshBasicMaterial({ color: 0xff5252, side: THREE.DoubleSide });
            const enemyGoal = new THREE.Mesh(goalGeo, goalMat);
            enemyGoal.rotation.x = -Math.PI / 2;
            enemyGoal.position.set(0, 0.05, -28);
            scene.add(enemyGoal);
            window.enemyGoalZone = enemyGoal;
        }

        function createPlayer() {
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffca28 }));
            body.position.y = 1;
            player.add(body);
            player.position.set(0, 0, 25);
            scene.add(player);
        }

        function createAimIndicator() {
            aimArrow = new THREE.Group();
            const shape = new THREE.Shape();
            shape.moveTo(0, 0); shape.lineTo(0.3, 0); shape.lineTo(0.3, 3);
            shape.lineTo(0.7, 3); shape.lineTo(0, 4.5); shape.lineTo(-0.7, 3);
            shape.lineTo(-0.3, 3); shape.lineTo(-0.3, 0); shape.closePath();
            const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xffeb3b, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
            mesh.rotation.x = -Math.PI / 2;
            aimArrow.add(mesh);
            scene.add(aimArrow);
        }

        // 產生野怪與中央 BOSS
        function spawnWildMonsters() {
            const list = [
                { x: -10, z: 0, hp: 300, boss: false },
                { x: 10, z: 0, hp: 300, boss: false },
                { x: 0, z: -15, hp: 1200, boss: true } // 中央烈空坐 BOSS
            ];
            list.forEach(item => {
                const group = new THREE.Group();
                const mGeo = new THREE.SphereGeometry(item.boss ? 1.8 : 0.9, 16, 16);
                const mMat = new THREE.MeshStandardMaterial({ color: item.boss ? 0x9c27b0 : 0x78909c });
                const mesh = new THREE.Mesh(mGeo, mMat);
                mesh.position.y = item.boss ? 1.8 : 0.9;
                group.add(mesh);
                group.position.set(item.x, 0, item.z);
                scene.add(group);

                wildMonsters.push({ group, hp: item.hp, maxHp: item.hp, boss: item.boss, alive: true, pos: group.position });
            });
        }

        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = true; if (k === 'a') keys.a = true;
                if (k === 's') keys.s = true; if (k === 'd') keys.d = true;
                if (k === 'z') castSkillZ();
                if (k === 'e') tryScoreGoal();
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = false; if (k === 'a') keys.a = false;
                if (k === 's') keys.s = false; if (k === 'd') keys.d = false;
            });
            window.addEventListener('mousemove', (e) => {
                mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
                mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            document.getElementById('btn-z').addEventListener('click', castSkillZ);
            document.getElementById('score-btn').addEventListener('click', tryScoreGoal);
        }

        // 投籃得分機制
        function tryScoreGoal() {
            if (playerStats.energy <= 0) return;
            const dist = player.position.distanceTo(window.enemyGoalZone.position);
            if (dist < 5) {
                let points = playerStats.energy;
                if (isFinalStretch) points *= 2; // 最後兩分鐘雙倍得分
                gameScores.team += points;
                playerStats.energy = 0;
                document.getElementById('team-score').innerText = gameScores.team;
                document.getElementById('energy-count').innerText = 0;
                document.getElementById('score-btn').style.display = 'none';
                alert(`🏀 投籃成功！為團隊獲得 ${points} 分！`);
            }
        }

        function castSkillZ() {
            createProjectile(player.position.clone().add(new THREE.Vector3(0, 1, 0)), mouseAimDir.clone(), 90, 15);
        }

        function createProjectile(pos, dir, dmg, range) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffeb3b }));
            mesh.position.copy(pos);
            scene.add(mesh);
            projectiles.push({ mesh, dir, speed: 0.7, damage: dmg, range, traveled: 0 });
        }

        // 掉落能量球
        function spawnEnergyOrb(pos, val) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
            mesh.position.copy(pos).y = 0.5;
            scene.add(mesh);
            energyOrbs.push({ mesh, value: val, pos: mesh.position });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // 1. 遊戲倒數計時與最後 2 分鐘機制
            if (gameSecondsLeft > 0) {
                gameSecondsLeft -= delta;
                const m = Math.floor(gameSecondsLeft / 60);
                const s = Math.floor(gameSecondsLeft % 60);
                document.getElementById('game-time').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                
                if (gameSecondsLeft <= 120 && !isFinalStretch) {
                    isFinalStretch = true;
                    document.getElementById('time-title').innerText = '🔥 最後衝刺 (雙倍)';
                    document.getElementById('time-title').className = 'text-[10px] text-red-500 font-extrabold animate-pulse';
                }
            }

            // 2. 防穿模移動檢測 (Collision Resolution)
            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveDir.z -= 1; if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1; if (keys.d) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize().multiplyScalar(playerStats.speed);
                const nextPos = player.position.clone().add(moveDir);

                // 碰撞檢測：檢查是否撞到牆壁或障礙物
                let collided = false;
                for (let obs of obstacles) {
                    const dist = Math.hypot(nextPos.x - obs.x, nextPos.z - obs.z);
                    if (dist < obs.radius + 1.0) { // 1.0 為角色半徑
                        collided = true;
                        break;
                    }
                }
                if (!collided) {
                    player.position.copy(nextPos);
                }
            }

            // 3. 滑鼠瞄準與旋轉
            raycaster.setFromCamera(mousePos, camera);
            const rayIntersectPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(groundPlane, rayIntersectPoint)) {
                mouseAimDir.subVectors(rayIntersectPoint, player.position);
                mouseAimDir.y = 0;
                if (mouseAimDir.lengthSq() > 0.001) mouseAimDir.normalize();
                player.rotation.y = Math.atan2(mouseAimDir.x, mouseAimDir.z);
            }

            aimArrow.position.copy(player.position);
            aimArrow.position.y = 0.05;
            aimArrow.rotation.y = Math.atan2(mouseAimDir.x, mouseAimDir.z);
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 24;

            // 4. 檢查是否進入得分點範圍
            if (player.position.distanceTo(window.enemyGoalZone.position) < 5 && playerStats.energy > 0) {
                document.getElementById('score-btn').style.display = 'block';
            } else {
                document.getElementById('score-btn').style.display = 'none';
            }

            // 5. 拾取能量球
            for (let i = energyOrbs.length - 1; i >= 0; i--) {
                const orb = energyOrbs[i];
                if (player.position.distanceTo(orb.pos) < 2.0) {
                    playerStats.energy = Math.min(playerStats.maxEnergy, playerStats.energy + orb.value);
                    document.getElementById('energy-count').innerText = playerStats.energy;
                    scene.remove(orb.mesh);
                    energyOrbs.splice(i, 1);
                }
            }

            // 6. 子彈與野怪碰撞檢測
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed));
                p.traveled += p.speed;

                let hit = false;
                wildMonsters.forEach(m => {
                    if (m.alive && p.mesh.position.distanceTo(m.pos) < 2.0) {
                        m.hp -= p.damage;
                        hit = true;
                        if (m.hp <= 0 && m.alive) {
                            m.alive = false;
                            m.group.visible = false;
                            spawnEnergyOrb(m.pos, m.boss ? 15 : 5); // 擊敗野怪掉能量
                        }
                    }
                });

                if (hit || p.traveled >= p.range) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
