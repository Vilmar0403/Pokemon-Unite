<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars x Pokémon Unite Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }
        #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .skill-btn { touch-action: manipulation; transition: transform 0.1s; }
        .skill-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- 遊戲大廳 / 設定介面 -->
    <div id="lobby-modal" class="absolute inset-0 bg-black/85 z-50 flex items-center justify-center interactive">
        <div class="bg-gray-900 border border-amber-500 rounded-2xl p-6 text-white max-w-md w-full shadow-2xl text-center space-y-4">
            <h2 class="text-2xl font-bold text-amber-400">🌵 荒野亂鬥 x 寶可夢大集結</h2>
            <p class="text-xs text-gray-300">使用 WASD 移動，滑鼠瞄準。擊敗中央仙人掌拿能量，去中間金庫得分區投籃！</p>
            
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-left space-y-2">
                <div class="text-xs text-gray-400">建立房號：</div>
                <div class="flex space-x-2">
                    <input type="text" id="my-room-input" class="bg-gray-900 border border-gray-600 rounded px-3 py-1.5 text-amber-300 font-bold flex-1 text-sm outline-none">
                    <button id="set-room-btn" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded text-xs font-bold">啟用</button>
                </div>
            </div>

            <button id="start-solo-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold text-base shadow">
                🎮 開始遊戲 / 進入地圖
            </button>
        </div>
    </div>

    <div id="game-container"></div>

    <!-- 遊戲 UI 介面 -->
    <div id="ui-layer" class="flex flex-col justify-between p-4">
        <div class="flex justify-between items-start">
            <div class="bg-gray-900/80 backdrop-blur border border-yellow-500/50 rounded-xl p-3 flex items-center space-x-3 text-white shadow-lg interactive">
                <div class="relative">
                    <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center font-bold text-xl border-2 border-white shadow">⚡</div>
                    <span id="player-level" class="absolute -bottom-1 -right-1 bg-blue-600 text-xs px-1.5 py-0.5 rounded-full font-bold border border-white">Lv.1</span>
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-amber-400">皮卡丘 (能量: <span id="energy-count">0</span>/30)</span>
                        <span id="hp-text" class="text-gray-300">1000 / 1000</span>
                    </div>
                    <div class="w-36 h-3 bg-gray-700 rounded-full overflow-hidden p-0.5 border border-gray-600">
                        <div id="hp-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-200" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900/80 backdrop-blur border border-gray-700 rounded-xl px-6 py-2 text-white flex items-center space-x-6 text-center shadow-lg">
                <div>
                    <div class="text-[10px] text-blue-400 font-bold">我方總分</div>
                    <div id="team-score" class="text-2xl font-bold text-blue-300">0</div>
                </div>
                <div class="border-r border-gray-700 h-8"></div>
                <div>
                    <div class="text-[10px] text-amber-400 font-bold">剩餘時間</div>
                    <div id="game-time" class="text-xl font-bold text-amber-300">10:00</div>
                </div>
                <div class="border-r border-gray-700 h-8"></div>
                <div>
                    <div class="text-[10px] text-red-400 font-bold">敵方總分</div>
                    <div id="enemy-score" class="text-2xl font-bold text-red-300">0</div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end pb-2">
            <div class="interactive flex flex-col items-start space-y-2">
                <button id="score-btn" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-extrabold px-5 py-3 rounded-2xl shadow-xl border-2 border-white text-sm hidden animate-bounce">
                    🏀 按 E 或點此投籃得分！
                </button>
            </div>

            <div class="flex flex-col items-end space-y-2 interactive">
                <div class="flex items-end space-x-2">
                    <button id="btn-v" class="skill-btn w-14 h-14 rounded-full bg-purple-600 border-2 border-purple-300 text-white font-bold flex flex-col items-center justify-center shadow-lg"><span class="text-sm">⚡</span><span class="text-[10px]">V/ZR</span></button>
                    <button id="btn-x" class="skill-btn w-16 h-16 rounded-full bg-gradient-to-r from-amber-500 to-red-500 border-2 border-yellow-200 text-white font-bold flex flex-col items-center justify-center shadow-xl -top-4 relative"><span class="text-base">👑</span><span class="text-[9px]">X/集結</span></button>
                </div>
                <div class="flex items-center space-x-3 pr-2">
                    <button id="btn-z" class="skill-btn w-14 h-14 rounded-full bg-blue-600 border-2 border-blue-300 text-white font-bold flex flex-col items-center justify-center shadow-lg"><span class="text-sm">⚔️</span><span class="text-[10px]">Z/普攻</span></button>
                    <button id="btn-c" class="skill-btn w-14 h-14 rounded-full bg-emerald-600 border-2 border-emerald-300 text-white font-bold flex flex-col items-center justify-center shadow-lg"><span class="text-sm">💨</span><span class="text-[10px]">C/R招</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let player, aimArrow;
        let obstacles = [];
        let wildMonsters = [], energyOrbs = [], projectiles = [];

        const playerStats = { hp: 1000, maxHp: 1000, speed: 0.2, energy: 0, maxEnergy: 30, radius: 0.8 };
        const gameScores = { team: 0, enemy: 0 };
        const keys = { w: false, a: false, s: false, d: false };
        const mousePos = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let mouseAimDir = new THREE.Vector3(0, 0, -1);
        let gameSecondsLeft = 600;

        document.getElementById('my-room-input').value = 'bs_' + Math.floor(1000 + Math.random() * 9000);

        function startGame() {
            document.getElementById('lobby-modal').style.display = 'none';
        }

        document.getElementById('start-solo-btn').addEventListener('click', startGame);
        document.getElementById('set-room-btn').addEventListener('click', startGame);

        function initGame() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd2b48c);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 36, 26);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createBrawlStarsMap();
            createPlayer();
            createAimIndicator();
            spawnCactusBoss();

            setupInputs();
            animate();
        }

        function createBrawlStarsMap() {
            // 沙漠地面
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0xc29b61, roughness: 0.9 }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 邊界牆壁
            const addWall = (x, z, w, d) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 3, d), new THREE.MeshStandardMaterial({ color: 0x8d6e63 }));
                wall.position.set(x, 1.5, z);
                scene.add(wall);
                obstacles.push({ x, z, radius: Math.max(w, d) / 2 });
            };
            addWall(0, -30, 60, 2);
            addWall(0, 30, 60, 2);
            addWall(-30, 0, 2, 60);
            addWall(30, 0, 2, 60);

            // 木箱掩體
            const addBox = (x, z) => {
                const box = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 3), new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.5 }));
                box.position.set(x, 1, z);
                box.castShadow = true;
                scene.add(box);
                obstacles.push({ x, z, radius: 1.6 });
            };
            addBox(-12, -8); addBox(-8, -8);
            addBox(12, -8);  addBox(8, -8);
            addBox(-12, 8);  addBox(-8, 8);
            addBox(12, 8);   addBox(8, 8);

            // 中間金庫得分區 (緩速區域、投籃點)
            const vaultGeo = new THREE.BoxGeometry(6, 1.5, 4);
            const vaultMat = new THREE.MeshStandardMaterial({ color: 0x3f51b5, roughness: 0.3 });
            const vault = new THREE.Mesh(vaultGeo, vaultMat);
            vault.position.set(0, 0.75, 0);
            scene.add(vault);
            window.goalZone = vault; // 設定為得分金庫

            // 上下兩個出生點 (藍色圓圈)
            const spawnGeo = new THREE.RingGeometry(2, 2.5, 32);
            const spawnMat = new THREE.MeshBasicMaterial({ color: 0x2196f3, side: THREE.DoubleSide });
            
            const spawnTop = new THREE.Mesh(spawnGeo, spawnMat);
            spawnTop.rotation.x = -Math.PI / 2;
            spawnTop.position.set(0, 0.05, -20);
            scene.add(spawnTop);

            const spawnBottom = new THREE.Mesh(spawnGeo, spawnMat);
            spawnBottom.rotation.x = -Math.PI / 2;
            spawnBottom.position.set(0, 0.05, 20);
            scene.add(spawnBottom);
        }

        function createPlayer() {
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffca28 }));
            body.position.y = 1;
            player.add(body);
            player.position.set(0, 0, 20); // 預設在下方出生點
            scene.add(player);
        }

        function createAimIndicator() {
            aimArrow = new THREE.Group();
            const shape = new THREE.Shape();
            shape.moveTo(0, 0); shape.lineTo(0.3, 0); shape.lineTo(0.3, 3);
            shape.lineTo(0.7, 3); shape.lineTo(0, 4.5); shape.lineTo(-0.7, 3);
            shape.lineTo(-0.3, 3); shape.lineTo(-0.3, 0); shape.closePath();
            const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xffeb3b, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
            mesh.rotation.x = -Math.PI / 2;
            aimArrow.add(mesh);
            scene.add(aimArrow);
        }

        // 中央仙人掌 (烈空坐 BOSS)
        function spawnCactusBoss() {
            const cactusGroup = new THREE.Group();
            const cMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 3, 16), new THREE.MeshStandardMaterial({ color: 0x4caf50 }));
            cMesh.position.y = 1.5;
            cactusGroup.add(cMesh);
            const flower = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0xe91e63 }));
            flower.position.y = 3.2;
            cactusGroup.add(flower);

            cactusGroup.position.set(0, 0, -8);
            scene.add(cactusGroup);

            wildMonsters.push({ group: cactusGroup, hp: 1000, maxHp: 1000, alive: true, pos: cactusGroup.position });
        }

        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = true; if (k === 'a') keys.a = true;
                if (k === 's') keys.s = true; if (k === 'd') keys.d = true;
                if (k === 'z') castSkillZ();
                if (k === 'e') tryScoreGoal();
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = false; if (k === 'a') keys.a = false;
                if (k === 's') keys.s = false; if (k === 'd') keys.d = false;
            });
            window.addEventListener('mousemove', (e) => {
                mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
                mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            document.getElementById('btn-z').addEventListener('click', castSkillZ);
            document.getElementById('score-btn').addEventListener('click', tryScoreGoal);
        }

        function tryScoreGoal() {
            if (playerStats.energy <= 0) return;
            if (player.position.distanceTo(window.goalZone.position) < 5) {
                let pts = playerStats.energy;
                gameScores.team += pts;
                playerStats.energy = 0;
                document.getElementById('team-score').innerText = gameScores.team;
                document.getElementById('energy-count').innerText = 0;
                document.getElementById('score-btn').style.display = 'none';
                alert(`🏀 投籃成功！在金庫得分獲得 ${pts} 分！`);
            }
        }

        function castSkillZ() {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffeb3b }));
            mesh.position.copy(player.position).add(new THREE.Vector3(0, 1, 0));
            scene.add(mesh);
            projectiles.push({ mesh, dir: mouseAimDir.clone(), speed: 0.7, damage: 100, range: 18, traveled: 0 });
        }

        function spawnEnergyOrb(pos, val) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
            mesh.position.copy(pos).y = 0.5;
            scene.add(mesh);
            energyOrbs.push({ mesh, value: val, pos: mesh.position });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (gameSecondsLeft > 0) {
                gameSecondsLeft -= delta;
                const m = Math.floor(gameSecondsLeft / 60);
                const s = Math.floor(gameSecondsLeft % 60);
                document.getElementById('game-time').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            // 獨立 X/Z 軸滑動碰撞移動
            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveDir.z -= 1; if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1; if (keys.d) moveDir.x += 1;

            let currentSpeed = playerStats.speed;
            // 如果走到中間金庫緩速區域，速度減半
            if (player.position.distanceTo(window.goalZone.position) < 4) {
                currentSpeed *= 0.5;
            }

            if (moveDir.length() > 0) {
                moveDir.normalize().multiplyScalar(currentSpeed);

                const nextX = player.position.clone().add(new THREE.Vector3(moveDir.x, 0, 0));
                let cX = false;
                for (let obs of obstacles) {
                    if (Math.hypot(nextX.x - obs.x, nextX.z - obs.z) < obs.radius + playerStats.radius) { cX = true; break; }
                }
                if (!cX) player.position.x = nextX.x;

                const nextZ = player.position.clone().add(new THREE.Vector3(0, 0, moveDir.z));
                let cZ = false;
                for (let obs of obstacles) {
                    if (Math.hypot(nextZ.x - obs.x, nextZ.z - obs.z) < obs.radius + playerStats.radius) { cZ = true; break; }
                }
                if (!cZ) player.position.z = nextZ.z;
            }

            // 滑鼠瞄準與箭頭朝向修正
            raycaster.setFromCamera(mousePos, camera);
            const rayIntersectPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(groundPlane, rayIntersectPoint)) {
                mouseAimDir.copy(rayIntersectPoint).sub(player.position);
                mouseAimDir.y = 0;
                if (mouseAimDir.lengthSq() > 0.001) mouseAimDir.normalize();
            }

            aimArrow.position.copy(player.position);
            aimArrow.position.y = 0.05;
            aimArrow.rotation.y = Math.atan2(mouseAimDir.x, mouseAimDir.z);
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 26;

            // 靠近中間金庫得分區時顯示投籃按鈕
            if (player.position.distanceTo(window.goalZone.position) < 4.5 && playerStats.energy > 0) {
                document.getElementById('score-btn').style.display = 'block';
            } else {
                document.getElementById('score-btn').style.display = 'none';
            }

            for (let i = energyOrbs.length - 1; i >= 0; i--) {
                const orb = energyOrbs[i];
                if (player.position.distanceTo(orb.pos) < 2.0) {
                    playerStats.energy = Math.min(playerStats.maxEnergy, playerStats.energy + orb.value);
                    document.getElementById('energy-count').innerText = playerStats.energy;
                    scene.remove(orb.mesh);
                    energyOrbs.splice(i, 1);
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed));
                p.traveled += p.speed;

                let hit = false;
                wildMonsters.forEach(m => {
                    if (m.alive && p.mesh.position.distanceTo(m.pos) < 2.0) {
                        m.hp -= p.damage;
                        hit = true;
                        if (m.hp <= 0 && m.alive) {
                            m.alive = false;
                            m.group.visible = false;
                            spawnEnergyOrb(m.pos, 20);
                        }
                    }
                });

                if (hit || p.traveled >= p.range) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
